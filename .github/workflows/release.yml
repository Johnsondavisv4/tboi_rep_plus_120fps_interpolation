name: Build 120 FPS Interpolation release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Build all game versions and publish release
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: build-${{ github.run_id }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build and package all supported versions
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $versions = @(Get-Content game-versions.txt | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() })
          if ($versions.Count -eq 0) { throw 'No supported game versions listed' }
          foreach ($version in $versions) {
            if ($version -cnotmatch '^\d+\.\d+\.\d+(?:[a-z]|\.\d+)$') { throw "Invalid game version: $version" }
            cmake -S . -B "build/$version" -G "Visual Studio 17 2022" -A Win32 "-DGAME_VERSION=$version"
            if ($LASTEXITCODE -ne 0) { throw "Configuration failed for $version" }
            cmake --build "build/$version" --config Release
            if ($LASTEXITCODE -ne 0) { throw "Build failed for $version" }

            $package = "build/package-$version"
            New-Item -ItemType Directory -Path $package -Force | Out-Null
            Copy-Item "build/$version/Release/dinput8.dll" $package
            Copy-Item interpol.ini $package
            $edition = if ($version -match '[a-z]$') { 'repentance' } else { 'repentance-plus' }
            $archive = "dist/isaac-120fps-interpolation-$edition-$version.zip"
            Compress-Archive -Path "$package/dinput8.dll", "$package/interpol.ini" -DestinationPath $archive -Force
          }
          Get-ChildItem dist -Filter *.zip | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Delete all previous releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseIds = @(gh api --paginate "repos/$env:GH_REPO/releases?per_page=100" --jq '.[].id')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list previous releases' }
          $tags = @(gh api --paginate "repos/$env:GH_REPO/tags?per_page=100" --jq '.[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list previous tags' }

          foreach ($releaseId in $releaseIds) {
            gh api --method DELETE "repos/$env:GH_REPO/releases/$releaseId" --silent
            if ($LASTEXITCODE -ne 0) { throw "Could not delete release $releaseId" }
          }
          foreach ($tag in $tags) {
            $encodedTag = [Uri]::EscapeDataString($tag)
            gh api --method DELETE "repos/$env:GH_REPO/git/refs/tags/$encodedTag" --silent
            if ($LASTEXITCODE -ne 0) { throw "Could not delete tag $tag" }
          }

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          $versions = @(Get-Content game-versions.txt | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() })
          if ($versions.Count -eq 0) { throw 'No supported game versions listed' }
          $releaseTitle = "120 FPS Interpolation — Repentance+ $($versions[-1])"
          gh release create "$env:RELEASE_TAG" --target "$env:RELEASE_COMMIT" --draft --generate-notes --title "$releaseTitle"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          gh release upload "$env:RELEASE_TAG" @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
          gh release edit "$env:RELEASE_TAG" --title "$releaseTitle" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
